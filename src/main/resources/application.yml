server:
  address: 0.0.0.0
  port: 8080
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 127\\.0\\.0\\.1|::1|10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[0-1])\\.\\d{1,3}\\.\\d{1,3}
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}/${DB_NAME}
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    default-encoding: UTF-8
    host: smtp.naver.com
    port: 465
    username: ${EMAIL_ADDRESS}
    password: ${EMAIL_PASSWORD}
    protocol: smtp
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.naver.com
security:
  jwt:
    token:
      secret-key: ${PROJECT_NAME_HERE_SECRET_KEY}
      expire-length: ${EXPIRE_LENGTH_IN_MILLISECONDS}
file:
  storage: ${FILE_STORAGE:LOCAL}
  image:
    max-size-bytes: ${IMAGE_MAX_FILE_SIZE_BYTES:10000000}
  file-dir: ${FILE_DIR}
  s3:
    bucket: ${FILE_S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
book:
  api:
    url: ${NAVER_BOOK_API_URL}
    id: ${NAVER_BOOK_CLIENT_ID}
    secret: ${NAVER_BOOK_CLIENT_SECRET}

kubernetes:
  api:
    key: ${KUBERNETES_API_KEY}
gamification:
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
  club-wifi:
    allowed-ips: ${CLUB_WIFI_ALLOWED_IPS:127.0.0.1}
