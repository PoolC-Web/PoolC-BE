name: Deploy backend to production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: poolc-backend-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: poolc-web/poolc-be

jobs:
  test:
    name: Test and package backend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poolc_test
          POSTGRES_USER: poolc
          POSTGRES_PASSWORD: poolc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poolc -d poolc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run tests and package application
        env:
          DB_HOST: localhost:5432
          TEST_DB_NAME: poolc_test
          DB_USER_NAME: poolc
          DB_PASSWORD: poolc_dev_password
          PROJECT_NAME_HERE_SECRET_KEY: ci_test_secret_key
          EXPIRE_LENGTH_IN_MILLISECONDS: "3600000"
          FILE_DIR: ${{ runner.temp }}/poolc-files
          EMAIL_ADDRESS: ci@example.com
          EMAIL_PASSWORD: dummy
          NAVER_BOOK_API_URL: https://openapi.naver.com/v1/search/book.json
          NAVER_BOOK_CLIENT_ID: dummy
          NAVER_BOOK_CLIENT_SECRET: dummy
          KUBERNETES_API_KEY: local-ci
        run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: poolc-backend-jar
          path: build/libs/app.jar
          if-no-files-found: error

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poolc-backend-jar
          path: build/libs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  deploy:
    name: Deploy immutable image to Lightsail
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Lightsail SSH access
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/lightsail
          chmod 600 ~/.ssh/lightsail
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
      - name: Deploy backend and restart Nginx
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ needs.image.outputs.image_tag }}
        run: |
          scp -i ~/.ssh/lightsail deploy/lightsail/docker-compose.production.yaml \
            "$LIGHTSAIL_USER@$LIGHTSAIL_HOST:/home/ubuntu/backend/docker-compose.production.yaml"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/lightsail "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          ssh -i ~/.ssh/lightsail "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" \
            "cd /home/ubuntu/backend && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.production.yaml pull palkia && IMAGE_TAG='$IMAGE_TAG' docker compose -f docker-compose.production.yaml up -d --no-deps palkia && docker compose -f docker-compose.production.yaml restart nginx && docker compose -f docker-compose.production.yaml ps"
