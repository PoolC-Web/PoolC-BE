name: Deploy backend to production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: poolc-backend-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY }}
  BACKEND_SECRET_ID: ${{ vars.BACKEND_SECRET_ID }}
  SSM_BACKEND_INSTANCE_ID: ${{ vars.SSM_BACKEND_INSTANCE_ID }}

jobs:
  test:
    name: Test and package backend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poolc_test
          POSTGRES_USER: poolc
          POSTGRES_PASSWORD: poolc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poolc -d poolc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run tests and package application
        env:
          DB_HOST: localhost:5432
          TEST_DB_NAME: poolc_test
          DB_USER_NAME: poolc
          DB_PASSWORD: poolc_dev_password
          PROJECT_NAME_HERE_SECRET_KEY: ci_test_secret_key
          EXPIRE_LENGTH_IN_MILLISECONDS: "3600000"
          FILE_DIR: ${{ runner.temp }}/poolc-files
          EMAIL_ADDRESS: ci@example.com
          EMAIL_PASSWORD: dummy
          NAVER_BOOK_API_URL: https://openapi.naver.com/v1/search/book.json
          NAVER_BOOK_CLIENT_ID: dummy
          NAVER_BOOK_CLIENT_SECRET: dummy
          KUBERNETES_API_KEY: local-ci
        run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: poolc-backend-jar
          path: build/libs/app.jar
          if-no-files-found: error

  image:
    name: Build and publish ECR image
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_uri: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: poolc-backend-jar
          path: build/libs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:production
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_BACKEND_REPOSITORY }}:sha-${{ github.sha }}

  deploy:
    name: Deploy through SSM Run Command
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update Lightsail without SSH
        env:
          ECR_IMAGE: ${{ needs.image.outputs.image_uri }}
        run: |
          compose_base64="$(base64 < deploy/lightsail/docker-compose.production.yaml | tr -d '\n')"
          ecr_registry="${ECR_IMAGE%%/*}"
          command_lines="$(jq -cn \
            --arg compose "$compose_base64" \
            --arg image "$ECR_IMAGE" \
            --arg registry "$ecr_registry" \
            --arg region "$AWS_REGION" \
            --arg secret "$BACKEND_SECRET_ID" \
            '[
              "set -euo pipefail",
              "install -d -m 700 /home/ubuntu/backend",
              "printf %s \($compose) | base64 -d > /home/ubuntu/backend/docker-compose.production.yaml",
              "chmod 600 /home/ubuntu/backend/docker-compose.production.yaml",
              "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
              "umask 077",
              "aws secretsmanager get-secret-value --region \($region) --secret-id \($secret) --query SecretString --output text > /home/ubuntu/backend/.env.production",
              "cd /home/ubuntu/backend",
              "ECR_IMAGE=\"\($image)\" docker compose -f docker-compose.production.yaml pull palkia",
              "ECR_IMAGE=\"\($image)\" docker compose -f docker-compose.production.yaml up -d --no-deps palkia",
              "docker compose -f docker-compose.production.yaml restart nginx",
              "docker compose -f docker-compose.production.yaml ps"
            ]')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$SSM_BACKEND_INSTANCE_ID" \
            --parameters "{\"commands\":$command_lines}" \
            --comment "Deploy PoolC backend $GITHUB_SHA" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$SSM_BACKEND_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$SSM_BACKEND_INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' --output json
