name: Deploy backend to production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: poolc-backend-production
  cancel-in-progress: false

jobs:
  test:
    name: Test and package backend
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poolc_test
          POSTGRES_USER: poolc
          POSTGRES_PASSWORD: poolc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poolc -d poolc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Read deployment configuration
        run: |
          echo "aws_region=$(jq -r '.awsRegion' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(jq -r '.githubOidcRoleArn' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$(jq -r '.ecrRepository' deploy/production.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run tests and package application
        env:
          DB_HOST: localhost:5432
          TEST_DB_NAME: poolc_test
          DB_USER_NAME: poolc
          DB_PASSWORD: poolc_dev_password
          PROJECT_NAME_HERE_SECRET_KEY: ci_test_secret_key
          EXPIRE_LENGTH_IN_MILLISECONDS: "3600000"
          FILE_DIR: ${{ runner.temp }}/poolc-files
          EMAIL_ADDRESS: ci@example.com
          EMAIL_PASSWORD: dummy
          NAVER_BOOK_API_URL: https://openapi.naver.com/v1/search/book.json
          NAVER_BOOK_CLIENT_ID: dummy
          NAVER_BOOK_CLIENT_SECRET: dummy
          KUBERNETES_API_KEY: local-ci
        run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: poolc-backend-jar
          path: build/libs/app.jar
          if-no-files-found: error

  image:
    name: Build and publish ECR image
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      image_uri: ${{ steps.ecr-login.outputs.registry }}/${{ steps.config.outputs.ecr_repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Read deployment configuration
        run: |
          echo "aws_region=$(jq -r '.awsRegion' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(jq -r '.githubOidcRoleArn' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$(jq -r '.ecrRepository' deploy/production.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: poolc-backend-jar
          path: build/libs
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.aws_region }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ steps.config.outputs.ecr_repository }}:sha-${{ github.sha }}

  deploy:
    name: Deploy through SSM Run Command
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Read deployment configuration
        run: |
          echo "aws_region=$(jq -r '.awsRegion' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(jq -r '.githubOidcRoleArn' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "ssm_instance_id=$(jq -r '.ssmManagedInstanceId' deploy/production.json)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.aws_region }}
      - name: Update Lightsail without SSH
        env:
          ECR_IMAGE: ${{ needs.image.outputs.image_uri }}
        run: |
          compose_base64="$(base64 < deploy/lightsail/docker-compose.production.yaml | tr -d '\n')"
          env_renderer_base64="$(base64 < deploy/lightsail/render-env-from-ssm.sh | tr -d '\n')"
          ecr_registry="${ECR_IMAGE%%/*}"
          ecr_password_base64="$(aws ecr get-login-password --region "${{ steps.config.outputs.aws_region }}" | base64 -w 0)"
          command_lines="$(jq -cn \
            --arg compose "$compose_base64" \
            --arg env_renderer "$env_renderer_base64" \
            --arg image "$ECR_IMAGE" \
            --arg registry "$ecr_registry" \
            --arg password "$ecr_password_base64" \
            '[
              "set -eu",
              "install -d -m 700 /home/ubuntu/backend",
              "printf %s \($compose) | base64 -d > /home/ubuntu/backend/docker-compose.production.yaml",
              "chmod 600 /home/ubuntu/backend/docker-compose.production.yaml",
              "printf %s \($env_renderer) | base64 -d > /home/ubuntu/backend/render-env-from-ssm.sh",
              "chmod 700 /home/ubuntu/backend/render-env-from-ssm.sh",
              "sudo -u ubuntu /home/ubuntu/backend/render-env-from-ssm.sh",
              "printf %s \($password) | base64 -d | docker login --username AWS --password-stdin \($registry)",
              "cd /home/ubuntu/backend",
              "ECR_IMAGE=\"\($image)\" docker compose -f docker-compose.production.yaml pull palkia",
              "ECR_IMAGE=\"\($image)\" docker compose -f docker-compose.production.yaml up -d --no-deps palkia",
              "docker compose -f docker-compose.production.yaml restart nginx",
              "docker compose -f docker-compose.production.yaml ps"
            ]')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${{ steps.config.outputs.ssm_instance_id }}" \
            --parameters "{\"commands\":$command_lines}" \
            --comment "Deploy PoolC backend $GITHUB_SHA" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ steps.config.outputs.ssm_instance_id }}"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ steps.config.outputs.ssm_instance_id }}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' --output json
