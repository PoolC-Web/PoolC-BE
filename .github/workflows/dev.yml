name: Build staging backend image

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: poolc-backend-staging
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: poolc-web/poolc-be

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Run tests
        run: ./gradlew test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      - name: Update PKS staging image
        env:
          GITOPS_TOKEN: ${{ secrets.POOLC_GITOPS_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$GITOPS_TOKEN"
          workdir="$(mktemp -d)"
          git clone --depth=1 "https://x-access-token:${GITOPS_TOKEN}@github.com/PoolC-Web/PKS.git" "$workdir"
          cd "$workdir"
          sed -i "s#image: ghcr.io/poolc-web/poolc-be:[^[:space:]]*#image: ghcr.io/poolc-web/poolc-be:${IMAGE_TAG}#" environments/poolc/staging/manifests/backend.yaml
          git config user.name "PoolC staging CI"
          git config user.email "poolc-staging-ci@users.noreply.github.com"
          git add environments/poolc/staging/manifests/backend.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(staging): deploy backend ${IMAGE_TAG}"
          git push
