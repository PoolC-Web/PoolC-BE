name: Production dry run (backend)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/production-dry-run.yml'
      - 'deploy/production.json'

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: poolc_test
          POSTGRES_USER: poolc
          POSTGRES_PASSWORD: poolc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poolc -d poolc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - id: config
        name: Read deployment configuration
        run: |
          echo "aws_region=$(jq -r '.awsRegion' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "role_arn=$(jq -r '.githubOidcDryRunRoleArn' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "ecr_repository=$(jq -r '.ecrDryRunRepository' deploy/production.json)" >> "$GITHUB_OUTPUT"
          echo "ssm_instance_id=$(jq -r '.ssmManagedInstanceId' deploy/production.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle
      - name: Run tests and package application
        env:
          DB_HOST: localhost:5432
          TEST_DB_NAME: poolc_test
          DB_USER_NAME: poolc
          DB_PASSWORD: poolc_dev_password
          PROJECT_NAME_HERE_SECRET_KEY: ci_test_secret_key
          EXPIRE_LENGTH_IN_MILLISECONDS: "3600000"
          FILE_DIR: ${{ runner.temp }}/poolc-files
          EMAIL_ADDRESS: ci@example.com
          EMAIL_PASSWORD: dummy
          NAVER_BOOK_API_URL: https://openapi.naver.com/v1/search/book.json
          NAVER_BOOK_CLIENT_ID: dummy
          NAVER_BOOK_CLIENT_SECRET: dummy
          KUBERNETES_API_KEY: local-ci
        run: ./gradlew test bootJar --no-daemon
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role_arn }}
          aws-region: ${{ steps.config.outputs.aws_region }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login
      - name: Build and publish disposable ECR image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ steps.config.outputs.ecr_repository }}:dryrun-${{ github.sha }}
      - name: Verify Lightsail ECR pull without changing runtime
        env:
          ECR_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ steps.config.outputs.ecr_repository }}:dryrun-${{ github.sha }}
        run: |
          ecr_registry="${ECR_IMAGE%%/*}"
          ecr_password_base64="$(aws ecr get-login-password | base64 -w 0)"
          command_lines="$(jq -cn \
            --arg password "$ecr_password_base64" \
            --arg registry "$ecr_registry" \
            --arg image "$ECR_IMAGE" \
            '[
              "set -eu",
              "printf %s \($password) | base64 -d | docker login --username AWS --password-stdin \($registry)",
              "docker pull \($image)",
              "docker image rm \($image)"
            ]')"
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "${{ steps.config.outputs.ssm_instance_id }}" \
            --parameters "{\"commands\":$command_lines}" \
            --comment "Validate PoolC backend ECR pull path" \
            --query 'Command.CommandId' \
            --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "${{ steps.config.outputs.ssm_instance_id }}"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "${{ steps.config.outputs.ssm_instance_id }}" \
            --query '{Status:Status,Output:StandardOutputContent}' --output json
          aws ecr batch-delete-image --repository-name "${{ steps.config.outputs.ecr_repository }}" --image-ids imageTag="dryrun-${{ github.sha }}"
