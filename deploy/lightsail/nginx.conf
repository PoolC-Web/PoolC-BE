events {}

http {
    server_tokens off;
    client_max_body_size 55m;

    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

    server {
        listen 443 ssl;
        server_name api.poolc.org;

        ssl_certificate /etc/letsencrypt/live/api.poolc.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.poolc.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            limit_req zone=api_per_ip burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://palkia:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    server {
        listen 80;
        server_name api.poolc.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
