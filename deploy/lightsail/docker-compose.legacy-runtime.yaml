services:
  palkia:
    image: openjdk:11-jdk-slim
    container_name: palkia
    env_file:
      - .env.production
    expose:
      - "8080"
    volumes:
      - /home/ubuntu/file:/file
      - /home/ubuntu/.aws:/root/.aws:ro
      - /home/ubuntu/palkia:/home
    command: ["java", "-jar", "/home/poolc-0.0.1-SNAPSHOT.jar"]
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: backend-nginx-1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    restart: on-failure
    depends_on:
      - palkia
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
