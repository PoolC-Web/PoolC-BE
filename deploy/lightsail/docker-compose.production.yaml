services:
  palkia:
    image: ${ECR_IMAGE}
    container_name: palkia
    env_file:
      - .env.production
    expose:
      - "8080"
    volumes:
      - /home/ubuntu/file:/file
      - /home/ubuntu/.aws:/root/.aws:ro
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

  nginx:
    image: nginx:1.27-alpine
    container_name: backend-nginx-1
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - palkia
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
